name: Update formula and manifest

# The private edge-fire-service CI publishes each CLI release here.
# This workflow points the Homebrew formula and the Scoop manifest at it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v1.1049.1
        required: true

concurrency:
  group: update-formula
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render formula and manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version="${TAG#v}"
          current=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/chili-piper-cli.rb 2>/dev/null || true)
          if [ -n "$current" ] && [ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -1)" != "$version" ]; then
            echo "Formula is at $current, newer than $version. Nothing to do."
            exit 0
          fi
          mkdir assets
          gh release download "$TAG" --dir assets
          scripts/render.sh "$version" assets

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula bucket
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chili-piper-cli ${{ github.event.release.tag_name || inputs.tag }}"
          git push
